<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030914">
<title>J.A.R.V.I.S 6.3</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  background: radial-gradient(circle at 50% 35%, #07335b, #020914 70%);
  color: #a8eaff;
  font-family: Arial, sans-serif;
  text-align: center;
}

.clock {
  font-size: 38px;
  letter-spacing: 4px;
  margin-top: 5px;
  text-shadow: 0 0 15px #00aaff;
}

.date {
  color: #83aabe;
  margin-top: 8px;
  font-size: 17px;
}

.core {
  width: 220px;
  height: 220px;
  border: 5px solid #42d5ff;
  border-radius: 50%;
  margin: 100px auto 75px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 25px #00aaff, inset 0 0 30px #0066aa;
  animation: glow 3s infinite alternate;
  position: relative;
}

.core::before,
.core::after {
  content: "";
  position: absolute;
  border: 2px solid #39caff;
  border-radius: 50%;
}

.core::before {
  width: 270px;
  height: 270px;
  border-left-color: transparent;
  border-right-color: transparent;
  animation: spin 8s linear infinite;
}

.core::after {
  width: 310px;
  height: 310px;
  border-top-color: transparent;
  border-bottom-color: transparent;
  animation: spin 12s linear infinite reverse;
}

.core h1 {
  font-size: 27px;
  letter-spacing: 5px;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #00aaff; }
  to { box-shadow: 0 0 45px #00aaff, inset 0 0 30px #0077cc; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.status {
  border: 1px solid #14658a;
  border-radius: 14px;
  padding: 22px;
  margin: 30px auto;
  max-width: 620px;
  background: #05213a;
}

button {
  width: 100%;
  max-width: 570px;
  padding: 21px 12px;
  margin: 10px auto;
  display: block;
  background: rgba(0, 65, 110, 0.35);
  color: #a8eaff;
  border: 1px solid #43cfff;
  border-radius: 13px;
  font-size: 16px;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 12px #0077aa;
}

button:active {
  background: #075080;
}

button:disabled {
  opacity: 0.5;
}

.chat {
  max-width: 620px;
  margin: 30px auto;
  text-align: left;
}

.chat h3 {
  text-align: center;
  letter-spacing: 3px;
}

.response {
  min-height: 90px;
  max-height: 300px;
  overflow-y: auto;
  padding: 18px;
  border: 1px solid #17648b;
  border-radius: 12px;
  background: rgba(2, 18, 35, 0.85);
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.input-area {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.input-area input {
  min-width: 0;
  flex: 1;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #39caff;
  background: #06182a;
  color: white;
  font-size: 16px;
}

.input-area input::placeholder {
  color: #7899ad;
}

.input-area button {
  width: auto;
  margin: 0;
  padding: 14px;
  font-size: 14px;
  letter-spacing: 1px;
}

.small {
  font-size: 12px;
  color: #66869c;
  margin: 35px 0 10px;
}

@media(max-width: 400px) {
  .core {
    margin-top: 90px;
  }

  .input-area button {
    padding: 12px 9px;
  }
}
</style>
</head>

<body>

<div class="clock" id="clock">00:00:00</div>
<div class="date" id="date">Loading date...</div>

<div class="core">
  <h1>J.A.R.V.I.S</h1>
</div>

<div class="status" id="status">
  ● SYSTEM ONLINE
</div>

<button onclick="activateJarvis()">
  ACTIVATE JARVIS
</button>

<button onclick="listenToJarvis()">
  🎙️ SPEAK TO JARVIS
</button>

<div class="chat">
  <h3>JARVIS COMMUNICATION</h3>

  <div class="response" id="response">
    JARVIS: Hello. I am ready to assist you.
  </div>

  <div class="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Type your message..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="sendMessage()">
      SEND
    </button>
  </div>
</div>

<button onclick="openGemini()">
  OPEN GEMINI
</button>

<button onclick="openYouTube()">
  OPEN YOUTUBE
</button>

<button onclick="openWhatsApp()">
  OPEN WHATSAPP
</button>

<div class="small">
  J.A.R.V.I.S 6.3 · PERSONAL AI ASSISTANT
</div>

<script>

// =================================
// JARVIS CONFIGURATION
// =================================

https://jarvis-brain.saigovuri7.workers.dev

let jarvisSessionId =
localStorage.getItem("jarvisSessionId");

if (!jarvisSessionId) {
  jarvisSessionId =
    "jarvis_" + Date.now() + "_" +
    Math.random().toString(36).slice(2, 12);

  localStorage.setItem(
    "jarvisSessionId",
    jarvisSessionId
  );
}

// =================================
// CLOCK AND DATE
// =================================

function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-US", {
      hour12: true
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-US", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);

// =================================
// DISPLAY RESPONSE
// =================================

function showResponse(message) {
  document.getElementById("response").textContent =
    "JARVIS: " + message;
}

// =================================
// SPEAK RESPONSE
// =================================

function speak(text) {
  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";
  speech.rate = 0.92;
  speech.pitch = 1.05;
  speech.volume = 1;

  window.speechSynthesis.speak(speech);
}

// =================================
// SEND MESSAGE TO CLOUDFLARE
// =================================

async function sendToJarvis(message) {
  const status = document.getElementById("status");
  const sendButton = document.getElementById("sendButton");

  status.textContent = "● JARVIS IS THINKING...";
  sendButton.disabled = true;

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        sessionId: jarvisSessionId
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error");
    }

    if (!data.reply) {
      throw new Error("No reply received from JARVIS.");
    }

    showResponse(data.reply);
    speak(data.reply);

    status.textContent = "● SYSTEM ONLINE";

    return data.reply;

  } catch (error) {
    showResponse("Connection error: " + error.message);
    status.textContent = "● CONNECTION ERROR";
    return null;

  } finally {
    sendButton.disabled = false;
  }
}

// =================================
// TEXT MESSAGE
// =================================

async function sendMessage() {
  const input = document.getElementById("messageInput");
  const message = input.value.trim();

  if (!message) {
    return;
  }

  input.value = "";

  await sendToJarvis(message);
}

// Send when Enter is pressed
document.getElementById("messageInput")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });

// =================================
// MICROPHONE INPUT
// =================================

function listenToJarvis() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showResponse(
      "Speech recognition is not supported in this browser. Please use the text box."
    );
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  document.getElementById("status").textContent =
    "● LISTENING...";

  recognition.onresult = function(event) {
    const command =
      event.results[0][0].transcript.trim();

    document.getElementById("messageInput").value =
      command;

    sendMessage();
  };

  recognition.onerror = function(event) {
    document.getElementById("status").textContent =
      "● MICROPHONE ERROR: " + event.error;
  };

  recognition.onend = function() {
    if (
      document.getElementById("status").textContent ===
      "● LISTENING..."
    ) {
      document.getElementById("status").textContent =
        "● SYSTEM ONLINE";
    }
  };

  recognition.start();
}

// =================================
// ACTIVATE JARVIS
// =================================

function activateJarvis() {
  const greeting =
    "Hello. I am JARVIS, your personal AI assistant. All systems are online. How may I help you today?";

  showResponse(greeting);
  speak(greeting);
}

// =================================
// OPEN APPLICATIONS
// =================================

function openGemini() {
  window.open(
    "https://gemini.google.com/app",
    "_blank"
  );
}

function openYouTube() {
  window.open(
    "https://www.youtube.com/",
    "_blank"
  );
}

function openWhatsApp() {
  window.open(
    "https://web.whatsapp.com/",
    "_blank"
  );
}

</script>

</body>
</html>
