@keyframes scan{
from{top:35px}
to{top:145px}
}

@keyframes glow{
from{box-shadow:0 0 12px #00bfff}
to{box-shadow:0 0 40px #00dfff}
} 

@keyframes rotate{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

from{

function startJarvis(){
  const message = "Hello sir. I am JARVIS. Your personal assistant is ready. How may I help you?";
  const speech = new SpeechSynthesisUtterance(message);

  speech.lang = "en-IN";
  speech.rate = 0.9;
  speech.pitch = 1.05;
  speech.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}


async function listenToJarvis() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

    alert("Voice recognition is not supported.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
